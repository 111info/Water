<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ウォーターサーバー集金箱</title>
<style>
  :root {
    --bg-top: #bfe6f2;
    --bg-bottom: #eef8f5;
    --glass: rgba(255,255,255,0.46);
    --glass-strong: rgba(255,255,255,0.66);
    --glass-border: rgba(255,255,255,0.75);
    --text-main: #163238;
    --text-sub: #547077;
    --accent: #128a9e;
    --accent-dark: #0c6d7d;
    --paid: #3aa47c;
    --paid-bg: rgba(58,164,124,0.14);
    --unpaid: #c97a3f;
    --unpaid-bg: rgba(201,122,63,0.14);
    --shadow: 0 8px 32px rgba(22,50,56,0.14);
    --radius-lg: 32px;
    --radius-md: 24px;
    --radius-pill: 999px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic", "Hiragino Sans", sans-serif;
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background:
      radial-gradient(circle at 20% 8%, rgba(255,255,255,0.55), transparent 40%),
      linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 100%;
    max-width: 420px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 22px;
    position: relative;
  }

  .brand-icon {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
  }

  .brand h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }

  .settings-btn {
    position: absolute;
    right: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: var(--glass-strong);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-sub);
  }

  .screen {
    display: none;
  }
  .screen.active {
    display: block;
    animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .glass-card {
    background: var(--glass);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 22px;
  }

  /* --- Home screen --- */
  .status-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 26px;
  }

  .status-card .label {
    font-size: 14px;
    color: var(--text-sub);
    margin: 0 0 4px;
  }

  .status-card .month {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .status-pill.unpaid { background: var(--unpaid-bg); color: var(--unpaid); }
  .status-pill.paid { background: var(--paid-bg); color: var(--paid); }

  .status-sub {
    font-size: 12px;
    color: var(--text-sub);
    margin: 10px 0 0;
    text-align: right;
  }

  .pay-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 34px 10px 10px;
  }

  .pay-button {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(155deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    box-shadow: 0 14px 30px rgba(12,109,125,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .pay-button:active {
    transform: scale(0.96);
    box-shadow: 0 8px 18px rgba(12,109,125,0.3);
  }
  .pay-button .pay-label {
    font-size: 19px;
    font-weight: 700;
  }
  .pay-button .pay-amount {
    font-size: 15px;
    opacity: 0.92;
  }

  .paid-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 10px 6px;
    text-align: center;
  }
  .paid-hero .check-circle {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--paid-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }
  .paid-hero p {
    margin: 0;
    color: var(--text-sub);
    font-size: 14px;
  }
  .paid-hero .again-link {
    margin-top: 18px;
    border: none;
    background: none;
    color: var(--text-sub);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    padding: 6px;
  }

  /* --- Flow screen --- */
  .back-row {
    margin-bottom: 14px;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    background: var(--glass-strong);
    color: var(--text-main);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: var(--radius-pill);
    box-shadow: var(--shadow);
    cursor: pointer;
    backdrop-filter: blur(12px);
  }

  .instruction-card {
    text-align: center;
    padding: 30px 24px;
  }

  .instruction-icon {
    width: 84px;
    height: 84px;
    margin: 0 auto 20px;
    display: block;
  }

  .instruction-text {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.7;
    margin: 0 0 14px;
  }

  .instruction-note {
    font-size: 14px;
    color: var(--text-sub);
    margin: 0;
    line-height: 1.6;
  }

  .amount-tag {
    display: inline-block;
    margin-top: 18px;
    padding: 10px 22px;
    border-radius: var(--radius-pill);
    background: var(--paid-bg);
    color: var(--paid);
    font-weight: 700;
    font-size: 16px;
  }

  .primary-btn {
    width: 100%;
    margin-top: 20px;
    padding: 18px;
    border: none;
    border-radius: var(--radius-md);
    background: linear-gradient(155deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(12,109,125,0.3);
    transition: transform 0.15s ease;
  }
  .primary-btn:active { transform: scale(0.98); }

  .ghost-btn {
    width: 100%;
    margin-top: 12px;
    padding: 16px;
    border: none;
    border-radius: var(--radius-md);
    background: var(--glass-strong);
    color: var(--text-main);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow);
  }

  /* --- Done screen --- */
  .done-card {
    text-align: center;
    padding: 36px 24px 26px;
  }
  .done-check {
    width: 88px;
    height: 88px;
    margin: 0 auto 18px;
    animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); }
  }
  .done-title {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 6px;
  }
  .done-sub {
    font-size: 14px;
    color: var(--text-sub);
    margin: 0;
  }

  .notify-status {
    margin-top: 22px;
    padding: 16px 18px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 700;
    text-align: left;
  }
  .notify-status.ok { background: var(--paid-bg); color: var(--paid); }
  .notify-status.warn { background: var(--unpaid-bg); color: var(--unpaid); }
  .notify-status svg { flex-shrink: 0; }

  .notify-retry {
    margin-top: 10px;
    border: none;
    background: none;
    color: var(--text-sub);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  .loading {
    text-align: center;
    color: var(--text-sub);
    font-size: 14px;
    padding: 40px 0;
  }

  /* --- Settings modal --- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,40,45,0.35);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
  }
  .modal-overlay.active { display: flex; }

  .modal-card {
    width: 100%;
    max-width: 380px;
    max-height: 88vh;
    overflow-y: auto;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(18px);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 24px;
  }
  .modal-title {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 6px;
  }
  .modal-desc {
    font-size: 13px;
    color: var(--text-sub);
    line-height: 1.6;
    margin: 0 0 18px;
  }
  .modal-desc a { color: var(--accent); }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-sub);
    margin: 14px 0 6px;
  }
  .field-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid rgba(22,50,56,0.15);
    background: rgba(255,255,255,0.8);
    font-size: 14px;
    color: var(--text-main);
    font-family: inherit;
  }
  .field-input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }
  .modal-actions {
    flex-direction: row;
  }
  .modal-actions .ghost-btn,
  .modal-actions .primary-btn {
    margin-top: 0;
    flex: 1;
  }

  .save-note {
    font-size: 12px;
    margin: 10px 0 0;
    min-height: 16px;
  }
  .save-note.ok { color: var(--paid); }
</style>
</head>
<body>

<div class="app">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 4C24 4 10 21.5 10 31C10 39.2 16.3 44 24 44C31.7 44 38 39.2 38 31C38 21.5 24 4 24 4Z" fill="#128a9e" opacity="0.9"/>
      <path d="M16 32C16 36 19.5 39 24 39" stroke="white" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>
    </svg>
    <h1>ウォーターサーバー集金</h1>
  </div>

  <div id="loading" class="loading">読み込み中…</div>

  <!-- Home screen -->
  <div id="screen-home" class="screen">
    <div class="glass-card status-card">
      <div>
        <p class="label" id="month-label">今月の集金</p>
        <p class="month" id="month-title">—</p>
      </div>
      <span id="status-pill" class="status-pill unpaid">未入金</span>
    </div>

    <div class="glass-card" id="home-hero-wrap">
      <div id="pay-hero" class="pay-hero">
        <button class="pay-button" id="btn-go-pay">
          <span class="pay-label">入金する</span>
          <span class="pay-amount">3,300円</span>
        </button>
      </div>
      <div id="paid-hero" class="paid-hero" style="display:none;">
        <div class="check-circle">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
            <path d="M5 13l4 4L19 7" stroke="#3aa47c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p id="paid-sub">今月分は入金済みです</p>
        <button class="again-link" id="btn-again">入力を間違えた場合はこちら</button>
      </div>
    </div>
  </div>

  <!-- Payment flow screen -->
  <div id="screen-flow" class="screen">
    <div class="back-row">
      <button class="back-btn" id="btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        戻る
      </button>
    </div>

    <div class="glass-card instruction-card">
      <svg class="instruction-icon" viewBox="0 0 64 64" fill="none">
        <rect x="8" y="20" width="48" height="34" rx="10" fill="#128a9e" opacity="0.15"/>
        <rect x="8" y="20" width="48" height="34" rx="10" stroke="#128a9e" stroke-width="2.2"/>
        <path d="M20 20V14a4 4 0 014-4h16a4 4 0 014 4v6" stroke="#128a9e" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M27 30l4 10 4-10" stroke="#0c6d7d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="44" cy="34" r="5" stroke="#0c6d7d" stroke-width="2.2"/>
      </svg>
      <p class="instruction-text">月別に管理するため、後ろのボックスにある月ごとの札と一緒に、3,300円（お札・硬貨）をクリップで挟んで入れてください</p>
      <p class="instruction-note">硬貨はそのままで大丈夫です</p>
      <span class="amount-tag">3,300円</span>
    </div>

    <button class="primary-btn" id="btn-complete">入金完了</button>
  </div>

  <!-- Done screen -->
  <div id="screen-done" class="screen">
    <div class="glass-card done-card">
      <svg class="done-check" viewBox="0 0 88 88" fill="none">
        <circle cx="44" cy="44" r="42" fill="#3aa47c" opacity="0.14"/>
        <path d="M28 45l11 11 21-23" stroke="#3aa47c" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p class="done-title">入金ありがとうございました</p>
      <p class="done-sub" id="done-month-text">今月分の入金が完了しました</p>

      <div id="notify-status" class="notify-status ok" style="display:none;"></div>
      <button class="notify-retry" id="btn-retry-notify" style="display:none;">もう一度送信する</button>

      <button class="ghost-btn" id="btn-home">トップへ戻る</button>
    </div>
  </div>
</div>


<script>
(function () {
  const AMOUNT = 3300;
  const NOTIFY_CONFIG = {
    email:      "lados.info14@gmail.com",
    publicKey:  "EIcPpbogCOPwQm-au",
    serviceId:  "service_4csix8b",
    templateId: "template_dkmbnyt",
  };

  function getMonthKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    return `payment:${y}-${m}`;
  }
  function getMonthLabel(d) {
    return `${d.getFullYear()}年${d.getMonth() + 1}月`;
  }

  const now = new Date();
  const monthKey = getMonthKey(now);
  const monthLabel = getMonthLabel(now);

  const el = {
    loading: document.getElementById("loading"),
    home: document.getElementById("screen-home"),
    flow: document.getElementById("screen-flow"),
    done: document.getElementById("screen-done"),
    monthTitle: document.getElementById("month-title"),
    statusPill: document.getElementById("status-pill"),
    payHero: document.getElementById("pay-hero"),
    paidHero: document.getElementById("paid-hero"),
    paidSub: document.getElementById("paid-sub"),
    doneMonthText: document.getElementById("done-month-text"),
    notifyStatus: document.getElementById("notify-status"),
    retryBtn: document.getElementById("btn-retry-notify"),
  };
  let lastPaidAt = null;

  el.monthTitle.textContent = monthLabel;

  function showScreen(name) {
    [el.home, el.flow, el.done].forEach((s) => s.classList.remove("active"));
    ({ home: el.home, flow: el.flow, done: el.done })[name].classList.add("active");
  }

  function renderStatus(paid, paidAt) {
    if (paid) {
      el.statusPill.textContent = "入金済み";
      el.statusPill.className = "status-pill paid";
      el.payHero.style.display = "none";
      el.paidHero.style.display = "flex";
      if (paidAt) {
        const d = new Date(paidAt);
        const timeStr = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
        el.paidSub.textContent = `今月分は入金済みです（${timeStr}）`;
      } else {
        el.paidSub.textContent = "今月分は入金済みです";
      }
    } else {
      el.statusPill.textContent = "未入金";
      el.statusPill.className = "status-pill unpaid";
      el.payHero.style.display = "flex";
      el.paidHero.style.display = "none";
    }
  }

  function renderNotifyStatus(state, message) {
    el.notifyStatus.style.display = "flex";
    el.notifyStatus.className = `notify-status ${state === "ok" ? "ok" : "warn"}`;
    const icon =
      state === "ok"
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 9v4M12 17h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/></svg>';
    el.notifyStatus.innerHTML = `${icon}<span>${message}</span>`;
    el.retryBtn.style.display = state === "ok" ? "none" : "inline-block";
  }

  async function sendNotification(paidAtIso) {
    try {
      const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          service_id:  NOTIFY_CONFIG.serviceId,
          template_id: NOTIFY_CONFIG.templateId,
          user_id:     NOTIFY_CONFIG.publicKey,
          template_params: {
            month:   monthLabel,
            amount:  `${AMOUNT.toLocaleString()}円`,
            paid_at: new Date(paidAtIso).toLocaleString("ja-JP"),
          },
        }),
      });
      if (!res.ok) {
        const text = await res.text().catch(() => String(res.status));
        throw new Error(text);
      }
      renderNotifyStatus("ok", `${NOTIFY_CONFIG.email} に通知メールを送信しました`);
    } catch (e) {
      console.error("メール送信に失敗しました", e);
      renderNotifyStatus("warn", `メール送信に失敗しました（${e.message || e}）`);
    }
  }

  async function loadStatus() {
    try {
      const result = await window.storage.get(monthKey, true);
      const data = result ? JSON.parse(result.value) : null;
      renderStatus(!!(data && data.paid), data && data.paidAt);
    } catch (e) {
      // Key not found yet, or storage unavailable — treat as unpaid.
      renderStatus(false, null);
    } finally {
      el.loading.style.display = "none";
      showScreen("home");
    }
  }

  async function markPaid() {
    const record = { paid: true, paidAt: new Date().toISOString(), amount: AMOUNT };
    try {
      await window.storage.set(monthKey, JSON.stringify(record), true);
    } catch (e) {
      console.error("入金記録の保存に失敗しました", e);
    }
    renderStatus(true, record.paidAt);
    el.doneMonthText.textContent = `${monthLabel}分の入金が完了しました`;
    el.notifyStatus.style.display = "none";
    el.retryBtn.style.display = "none";
    lastPaidAt = record.paidAt;
    showScreen("done");
    sendNotification(record.paidAt);
  }

  async function undoPaid() {
    try {
      await window.storage.delete(monthKey, true);
    } catch (e) {
      console.error("取り消しに失敗しました", e);
    }
    renderStatus(false, null);
  }

  document.getElementById("btn-go-pay").addEventListener("click", () => showScreen("flow"));
  document.getElementById("btn-back").addEventListener("click", () => showScreen("home"));
  document.getElementById("btn-complete").addEventListener("click", markPaid);
  document.getElementById("btn-again").addEventListener("click", undoPaid);
  document.getElementById("btn-home").addEventListener("click", () => showScreen("home"));
  document.getElementById("btn-retry-notify").addEventListener("click", () => {
    if (lastPaidAt) sendNotification(lastPaidAt);
  });

  loadStatus();
})();
</script>

</body>
</html>
